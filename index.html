<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CARMAR · Cuenta Corriente Empleados</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#e3e6ec;--pri:#13315c;--pri2:#1e4a8a;--acc:#f2a900;--ok:#1b7a43;--bad:#b3261e;--r:12px}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit}
.top{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-size:17px}.top .sp{flex:1}.top button{background:transparent;color:#fff;border:1px solid #ffffff55}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:transparent;color:#cfd8e6;padding:6px 10px;border-radius:8px;cursor:pointer}
nav button.on{background:#ffffff22;color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{background:var(--pri2);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--pri2);border:1px solid var(--pri2)}.btn.acc{background:var(--acc);color:#222}
.btn.bad{background:#fff;color:var(--bad);border:1px solid var(--bad)}.btn.sm{padding:4px 9px;font-size:13px}
button{cursor:pointer}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.saldo{font-size:30px;font-weight:700;margin:4px 0}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef1f6;color:var(--mut)}
.pill.ok{background:#e3f4ea;color:var(--ok)}.pill.warn{background:#fff3d6;color:#8a5a00}
.mes{font-weight:600;background:#f7f8fb}
.scroll{overflow-x:auto}
.login{max-width:380px;margin:60px auto}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
.modal .card{width:100%;max-width:560px}
.demo{background:var(--acc);color:#222;text-align:center;font-size:13px;padding:4px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.liq input{min-width:110px;text-align:right;padding:5px 7px}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block}body{background:#fff}}
.doc{font-family:Georgia,serif;color:#000;padding:10mm 14mm;font-size:13pt;line-height:1.5}
.doc h2{margin:0;font-size:15pt}.doc .hd{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:12px}
.vale{height:138mm;border-bottom:1px dashed #888;padding:8mm 14mm;font-family:Georgia,serif;font-size:12pt;line-height:1.55;color:#000;position:relative}
.vale:last-child{border-bottom:0}.vale .big{font-size:16pt;font-weight:bold}
.firmas{display:flex;gap:30px;margin-top:40px}.firmas div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:11pt;text-align:center}
.copia{position:absolute;top:8mm;right:14mm;font-size:10pt;color:#555}
@media(max-width:600px){main{padding:10px}.saldo{font-size:26px}td,th{padding:6px 5px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
/* ============ CONFIGURACIÓN ============
   Pegá acá la config de tu proyecto Firebase (Consola > Configuración del proyecto > Tus apps > Web).
   Si apiKey queda vacío, la app corre en MODO DEMO (datos guardados solo en este navegador). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCo-AHx4CTPERAxEJ7oq9N696nhjTGb8Ug",
  authDomain: "carmar-apps.firebaseapp.com",
  databaseURL: "https://carmar-apps-default-rtdb.firebaseio.com",
  projectId: "carmar-apps",
  storageBucket: "carmar-apps.firebasestorage.app",
  messagingSenderId: "261163189274",
  appId: "1:261163189274:web:3bdfdbe7b8b6bcabb6bda3"
};
const EMPRESA = "CARLOS MARTÍN E HIJOS S.A.";
const EMAIL_DOM = "@empleados.carmar.app"; // dominio ficticio para login por DNI
const NS = "ccemp/";
// Administradores: el dueño (OWNER_UID) los da de alta automáticamente en su primer ingreso.
const OWNER_UID = "zVxXdESqrtO2IMkxeMojvjpWVB92";
const ADMINS_INICIALES = ["zVxXdESqrtO2IMkxeMojvjpWVB92","07oaOqkkqoTOqVU0Y3z5h6BHTVH3"]; // todo se guarda dentro de este nodo, para convivir con otras apps del mismo proyecto Firebase
const DEMO = !FIREBASE_CONFIG.apiKey;

/* ============ TIPOS DE MOVIMIENTO ============ */
const TIPOS = {
  ini:{l:'Saldo inicial',s:1}, sueldo:{l:'Sueldo',s:1}, adicional:{l:'AD',s:1},
  sac:{l:'SAC (aguinaldo)',s:1}, vac:{l:'Vacaciones',s:1}, aj:{l:'Ajuste',s:1},
  anticipo:{l:'Anticipo',s:-1}, ctacte:{l:'Compras Cta Cte',s:-1}
};
const ORD = {ini:0,anticipo:1,ctacte:2,sueldo:3,adicional:4,sac:5,vac:6,aj:7};
const LIQ_TIPOS = ['sueldo','adicional','sac','vac','ctacte'];
const COM_TIPOS = {
  vacaciones:{l:'Vacaciones',t:'Por medio de la presente se le notifica que se le otorgan ___ días de vacaciones anuales correspondientes al período ____, a gozar desde el día __/__/____ hasta el día __/__/____ inclusive, debiendo reintegrarse a sus tareas habituales el día __/__/____.'},
  apercibimiento:{l:'Apercibimiento',t:'Por medio de la presente se le aplica un APERCIBIMIENTO por el siguiente motivo: ____________________. Se le hace saber que la reiteración de conductas de este tipo dará lugar a la aplicación de sanciones disciplinarias de mayor gravedad.'},
  atencion:{l:'Llamado de atención',t:'Por medio de la presente se le formula un llamado de atención por el siguiente motivo: ____________________. Se le solicita ajustar su conducta a las normas internas de la empresa.'},
  suspension:{l:'Suspensión',t:'Por medio de la presente se le notifica la aplicación de una SUSPENSIÓN de ___ día/s sin goce de haberes, a cumplir desde el __/__/____ hasta el __/__/____ inclusive, por el siguiente motivo: ____________________. Deberá reintegrarse a sus tareas el día __/__/____.'},
  horario:{l:'Cambio de horario',t:'Por medio de la presente se le notifica que a partir del día __/__/____ su horario de trabajo será de ____ a ____ hs.'},
  general:{l:'Notificación general',t:''}
};

/* ============ UTILIDADES ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$ '+(Math.round((+n||0)*100)/100).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const perLabel=p=>{const[y,m]=p.split('-');return MESES[+m-1]+' '+y};
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fD=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const fDLargo=s=>{const d=new Date(s+'T12:00');return d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear()};
const today=()=>isoD(new Date());
const curPer=()=>today().slice(0,7);
const addPer=(p,k)=>{let[y,m]=p.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)};
const lastDay=p=>{const[y,m]=p.split('-').map(Number);return p+'-'+pad(new Date(y,m,0).getDate())};
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const val=m=>(TIPOS[m.t]?.s||1)*(+m.imp||0);
function sortMovs(arr){return arr.sort((a,b)=>a.per.localeCompare(b.per)||a.f.localeCompare(b.f)||(ORD[a.t]??9)-(ORD[b.t]??9))}
function saldoDe(movsObj){return Object.values(movsObj||{}).reduce((s,m)=>s+val(m),0)}

function letras(n){
  n=Math.round(Math.abs(n)*100)/100;const ent=Math.floor(n),cts=Math.round((n-ent)*100);
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const c999=x=>{if(!x)return'';if(x===100)return'cien';const c=Math.floor(x/100),r=x%100;const t=r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:'');return(C[c]+' '+t).trim()};
  const conv=x=>{if(x===0)return'cero';let s='';const mi=Math.floor(x/1e6),k=Math.floor((x%1e6)/1000),r=x%1000;
    if(mi)s+=(mi===1?'un millón':conv(mi)+' millones')+' ';if(k)s+=(k===1?'mil':c999(k)+' mil')+' ';if(r)s+=c999(r);return s.trim()};
  let s=conv(ent).replace(/veintiuno (mil|millones)/g,'veintiún $1').replace(/uno (mil|millones)/g,'un $1');
  return 'pesos '+s+' con '+pad(cts)+'/100';
}

/* ============ CAPA DE DATOS (Firebase o demo en memoria) ============ */
let fb=null,fdb=null;const MEM={};const MEMAUTH={};let memUser=null;
const DEMO_KEY='carmar_empleados_demo';
try{const sv=JSON.parse(localStorage.getItem(DEMO_KEY)||'null');if(DEMO&&sv){Object.assign(MEM,sv.mem||{});Object.assign(MEMAUTH,sv.auth||{})}}catch(e){}
function demoSave(){if(!DEMO)return;try{localStorage.setItem(DEMO_KEY,JSON.stringify({mem:MEM,auth:MEMAUTH}))}catch(e){console.warn('No se pudo guardar demo',e)}}
function demoReset(){if(!confirm('¿Borrar todos los datos de prueba guardados en este navegador?'))return;try{localStorage.removeItem(DEMO_KEY)}catch(e){}location.reload()}
if(!DEMO){fb=firebase.initializeApp(FIREBASE_CONFIG);fdb=firebase.database();}
const P=p=>p.split('/').filter(Boolean);
const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
function mget(p){return P(p).reduce((o,k)=>o==null?undefined:o[k],MEM)}
function mset(p,v){const ks=P(p);let o=MEM;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}if(v==null)delete o[ks.at(-1)];else o[ks.at(-1)]=clone(v)}
const DB={
  async get(p){return DEMO?clone(mget(p)??null):(await fdb.ref(NS+p).get()).val()},
  async set(p,v){if(DEMO){mset(p,v);demoSave();return}return fdb.ref(NS+p).set(v)},
  async update(obj){if(DEMO){for(const k in obj)mset(k,obj[k]);demoSave();return}const o={};for(const k in obj)o[NS+k]=obj[k];return fdb.ref().update(o)},
  key(p){return DEMO?uid():fdb.ref(NS+p).push().key},
  async nextVale(){if(DEMO){const n=(mget('config/valeSeq')||0)+1;mset('config/valeSeq',n);demoSave();return n}
    const r=await fdb.ref(NS+'config/valeSeq').transaction(x=>(x||0)+1);return r.snapshot.val()}
};
const AUTH={
  async loginEmp(dni,pin){if(DEMO){const a=MEMAUTH[dni+EMAIL_DOM];if(!a||a.pin!==pin)throw new Error('DNI o PIN incorrecto');memUser={uid:a.uid};return memUser}
    return (await fb.auth().signInWithEmailAndPassword(dni+EMAIL_DOM,pin)).user},
  async loginAdmin(email,pass){if(DEMO){if(email==='admin'&&pass==='admin'){memUser={uid:'admin'};MEM.admins={admin:true};return memUser}throw new Error('En demo: usuario admin / clave admin')}
    return (await fb.auth().signInWithEmailAndPassword(email,pass)).user},
  async logout(){memUser=null;if(!DEMO)await fb.auth().signOut()},
  async setAccess(empId,dni,pin,oldPin){
    const email=dni+EMAIL_DOM;let u;
    if(DEMO){const a=MEMAUTH[email];u=a?a.uid:uid();MEMAUTH[email]={uid:u,pin};demoSave()}
    else{const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');let cred;
      try{cred=await sec.auth().createUserWithEmailAndPassword(email,pin)}
      catch(e){if(e.code!=='auth/email-already-in-use')throw e;if(!oldPin)throw new Error('Ese DNI ya tiene cuenta y no hay PIN anterior guardado.');
        cred=await sec.auth().signInWithEmailAndPassword(email,oldPin);await cred.user.updatePassword(pin)}
      u=cred.user.uid;await sec.auth().signOut()}
    await DB.update({['users/'+u]:{emp:empId,dni},['pins/'+empId]:{dni,pin,uid:u}});
  }
};

/* ============ ESTADO ============ */
const S={role:null,emp:null,emps:{},movs:{},leg:{},pins:{},view:'emps',ficha:null,tab:'movs',liqPer:curPer(),imp:null,ad:{cfg:{},tabla:[],mes:{}},adPer:addPer(curPer(),-1),adImp:null,rec:{},recImp:null,ccImp:null};

async function loadAdmin(){
  const[e,m,l,p,a,rc]=await Promise.all([DB.get('empleados'),DB.get('movs'),DB.get('legajo'),DB.get('pins'),DB.get('ad'),DB.get('recibos')]);S.rec=rc||{};
  S.emps=e||{};S.movs=m||{};S.leg=l||{};S.pins=p||{};
  S.ad={cfg:a?.cfg||{},tabla:a?.tabla||TABLA_DEF,mes:a?.mes||{}};
}
async function loadEmp(empId){
  const[e,m,l,rc]=await Promise.all([DB.get('empleados/'+empId),DB.get('movs/'+empId),DB.get('legajo/'+empId),DB.get('recibos/'+empId)]);S.rec={[empId]:rc||{}};
  S.emps={[empId]:e||{nombre:'?'}};S.movs={[empId]:m||{}};S.leg={[empId]:l||{}};
}

/* ============ RENDER ============ */
function render(){
  const demo=DEMO?'<div class="demo">MODO DEMO — sin Firebase: los datos quedan guardados solo en este navegador · <a href="#" onclick="demoReset();return false">borrar datos de prueba</a></div>':'';
  if(!S.role){$('#app').innerHTML=demo+viewLogin();return}
  if(S.role==='emp'){$('#app').innerHTML=demo+`<div class="top"><b>CARMAR</b><span>Mi cuenta</span><span class="sp"></span><button class="btn sm" onclick="logout()">Salir</button></div><main>${viewCuenta(S.emp,false)}</main>`;return}
  const nav=[['emps','Empleados'],['liq','Liquidación mensual'],['ad','Cálculo AD'],['imp','Importar Excel']].map(([k,l])=>`<button class="${S.view===k&&!S.ficha?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  let body='';
  if(S.ficha)body=viewFicha(S.ficha);else if(S.view==='emps')body=viewEmps();else if(S.view==='liq')body=viewLiq();else if(S.view==='ad')body=viewAD();else body=viewImp();
  $('#app').innerHTML=demo+`<div class="top"><b>CARMAR · Empleados</b><nav>${nav}</nav><span class="sp"></span><button class="btn sm" onclick="logout()">Salir</button></div><main>${body}</main>`;
}
function go(v){S.view=v;S.ficha=null;render()}

function viewLogin(){
  const adm=S.loginAdmin;
  return `<div class="login card"><h2 style="margin-top:0">CARMAR</h2><p class="mut">${adm?'Ingreso administrador':'Consultá tu cuenta corriente'}</p>
  <form onsubmit="doLogin(event)">
  <label>${adm?'Email':'DNI'}</label><input id="lu" ${adm?'':'inputmode="numeric"'} autocomplete="username" required>
  <label>${adm?'Contraseña':'PIN'}</label><input id="lp" type="password" ${adm?'':'inputmode="numeric" maxlength="6"'} autocomplete="current-password" required>
  <div id="lerr" class="neg mut" style="margin-top:8px"></div>
  <button class="btn" style="width:100%;margin-top:12px">Ingresar</button></form>
  <p style="text-align:center;margin-bottom:0"><a href="#" onclick="S.loginAdmin=!S.loginAdmin;render();return false" class="mut">${adm?'Soy empleado':'Ingreso administrador'}</a></p></div>`;
}
async function doLogin(ev){
  ev.preventDefault();const u=$('#lu').value.trim(),p=$('#lp').value.trim();$('#lerr').textContent='';
  try{
    if(S.loginAdmin){const usr=await AUTH.loginAdmin(u,p);let ok=await DB.get('admins/'+usr.uid);if(!ok&&!DEMO&&usr.uid===OWNER_UID){const a={};ADMINS_INICIALES.forEach(x=>a[x]=true);await DB.update(Object.fromEntries(Object.keys(a).map(k=>['admins/'+k,true])));ok=true}if(!ok){await AUTH.logout();throw new Error('Este usuario no es administrador. Agregá su UID en /ccemp/admins.')}
      S.role='admin';await loadAdmin()}
    else{const usr=await AUTH.loginEmp(u.replace(/\D/g,''),p);const map=await DB.get('users/'+usr.uid);if(!map)throw new Error('Cuenta sin empleado asociado');
      S.role='emp';S.tab='movs';S.emp=map.emp;await loadEmp(map.emp)}
    render();
  }catch(e){$('#lerr').textContent=e.code?'DNI/usuario o clave incorrectos':e.message}
}
async function logout(){await AUTH.logout();$('#print').innerHTML='';S.tab='movs';S.showAll=false;Object.assign(S,{role:null,loginAdmin:false,emp:null,ficha:null,emps:{},movs:{},leg:{},pins:{}});render()}

/* ---------- Lista de empleados (admin) ---------- */
function viewEmps(){
  const ids=Object.keys(S.emps).sort((a,b)=>(S.emps[a].nombre||'').localeCompare(S.emps[b].nombre||''));
  const act=ids.filter(i=>S.emps[i].activo!==false),inact=ids.filter(i=>S.emps[i].activo===false);
  const tot=act.reduce((s,i)=>s+saldoDe(S.movs[i]),0);
  const row=i=>{const e=S.emps[i],s=saldoDe(S.movs[i]);const pend=Object.values(S.leg[i]||{}).filter(c=>c.estado!=='firmada').length;
    return `<tr><td><a href="#" onclick="openFicha('${i}');return false"><b>${esc(e.nombre)}</b></a><div class="mut">${e.dni?'DNI '+esc(e.dni):'sin DNI'} ${S.pins[i]?'<span class="pill ok">con acceso</span>':''} ${pend?`<span class="pill warn">${pend} sin firmar</span>`:''}</div></td>
    <td class="n ${s<0?'neg':'pos'}">${fmt(s)}</td><td class="n"><button class="btn sm acc" onclick="modalAnticipo('${i}')">Anticipo</button> <button class="btn sm sec" onclick="openFicha('${i}')">Ver</button></td></tr>`};
  return `<div class="card"><div class="row"><div><h2 style="margin:0">Empleados</h2><div class="mut">${act.length} activos · saldo total a favor de empleados: <b>${fmt(tot)}</b></div></div>
  <div style="flex:0"><button class="btn" onclick="modalEmp()">+ Empleado</button></div></div></div>
  <div class="card scroll"><table><thead><tr><th>Empleado</th><th class="n">Saldo</th><th></th></tr></thead><tbody>${act.map(row).join('')||'<tr><td colspan=3 class="mut">Sin empleados. Importá el Excel o creá uno.</td></tr>'}</tbody></table></div>
  ${inact.length?`<details class="card"><summary>Inactivos (${inact.length})</summary><table><tbody>${inact.map(row).join('')}</tbody></table></details>`:''}`;
}
function openFicha(i){S.ficha=i;S.tab='movs';render();window.scrollTo(0,0)}

/* ---------- Cuenta corriente (empleado y admin) ---------- */
function viewCuenta(i,admin){
  const e=S.emps[i]||{},movs=S.movs[i]||{},leg=S.leg[i]||{};
  const s=saldoDe(movs);
  const tabs=`<div class="tabs"><button class="${S.tab==='movs'?'on':''}" onclick="S.tab='movs';render()">Movimientos</button><button class="${S.tab==='leg'?'on':''}" onclick="S.tab='leg';render()">Comunicaciones (${Object.keys(leg).length})</button></div>`;
  const head=`<div class="card"><div class="mut">${admin?'Cuenta de':'Hola,'}</div><h2 style="margin:2px 0">${esc(e.nombre)}</h2>
   <div class="mut">${s>=0?'Saldo a tu favor (a cobrar)':'Saldo a descontar'}</div><div class="saldo ${s<0?'neg':'pos'}">${fmt(Math.abs(s))}</div>
   <div class="mut">Positivo: lo que la empresa te debe. Negativo: anticipos que superan lo liquidado.</div></div>`;
  return head+tabs+(S.tab==='movs'?tablaMovs(i,admin):tablaLeg(i,admin));
}

async function readImp(file){if(!file)return;$('#imp_msg').textContent='Leyendo...';
  try{const buf=await file.arrayBuffer();S.imp=parsePlanilla(buf);render()}catch(e){$('#imp_msg').textContent='Error: '+e.message;console.error(e)}}
function hdrDate(v){
  if(v instanceof Date){const d=new Date(v.getTime()+12*3600e3);return isoD(d)}
  if(typeof v==='string'){const m=v.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1])}
  return null;
}
const normH=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
function parsePlanilla(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets['2013'];if(!ws)throw new Error('No encuentro la hoja "2013"');
  const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  let hr=A.findIndex(r=>r&&r.some(v=>typeof v==='string'&&normH(v)==='empleado'));if(hr<0)throw new Error('No encuentro la fila de encabezados');
  const H=A[hr];const starts=[];H.forEach((v,c)=>{if(typeof v==='string'&&normH(v)==='empleado')starts.push(c)});
  const warn=[];
  const blocks=starts.map((s,bi)=>{const e=bi+1<starts.length?starts[bi+1]:H.length;const cols=[];let after=false;
    for(let c=s+1;c<e;c++){const h=H[c];if(h==null||h==='')continue;const d=hdrDate(h);
      if(d){const det=typeof h==='string'?h.trim().replace(/^\d{1,2}\/\d{1,2}\/\d{4}\s*/,''):'';cols.push({c,k:'anticipo',f:d,next:after,det});continue}
      const n=normH(h);
      if(n==='recibo')cols.push({c,k:'sueldo'});else if(n.startsWith('comision'))cols.push({c,k:'adicional'});else if(n==='sac')cols.push({c,k:'sac'});
      else if(n.startsWith('vacacion'))cols.push({c,k:'vac'});else if(n==='cta cte')cols.push({c,k:'ctacte'});else if(n==='a pagar'){cols.push({c,k:'ap'});after=true}
      else if(n.startsWith('total anti')){}else warn.push(`Columna "${h}" ignorada (bloque ${bi+1})`)}
    return{s,cols}});
  // período base: mes de la última fecha de anticipo del primer bloque
  const f0=blocks[0].cols.filter(x=>x.k==='anticipo'&&!x.next).map(x=>x.f).sort().at(-1);if(!f0)throw new Error('No pude determinar el mes inicial');
  const per0=f0.slice(0,7);
  const emps={},movs={},bad=[];let nMovs=0;
  const num=v=>typeof v==='number'?v:(typeof v==='string'&&v.trim()!==''&&!isNaN(+v)?+v:null);
  blocks.forEach((b,bi)=>{const per=addPer(per0,bi);
    for(let r=hr+1;r<A.length;r++){const row=A[r];if(!row)continue;const name=row[b.s];if(typeof name!=='string'||!name.trim())continue;
      const nm=name.trim().replace(/\s+/g,' ');const id=slug(nm);if(!id)continue;
      const isNew=!emps[id];const e=emps[id]??={nombre:nm,ap:null,activo:false};e.nombre=nm;const list=movs[id]??=[];
      let net=0,ap=null;const add=[];
      for(const x of b.cols){const v=num(row[x.c]);if(x.k==='ap'){ap=v;continue}if(v==null||v===0)continue;
        const t=x.k;const p=x.next?addPer(per,1):per;const f=t==='anticipo'?x.f:lastDay(per);
        if(!x.next)net+=TIPOS[t].s*v;add.push({t,f,per:p,imp:v,c:t==='anticipo'?(x.det||''):TIPOS[t].l+' '+perLabel(per),src:'xls'})}
      if(isNew){const ini=(ap??0)-net;if(Math.abs(ini)>0.005)list.push({t:'ini',f:lastDay(addPer(per,-1)),per:addPer(per,-1),imp:Math.round(ini*100)/100,c:'Saldo inicial',src:'xls'})}
      list.push(...add);
      const calc=list.filter(m=>m.per<=per).reduce((s,m)=>s+val(m),0);
      if(ap!=null&&Math.abs(calc-ap)>1)bad.push(`${nm} · ${perLabel(per)}: calculado ${fmt(calc)} vs A Pagar ${fmt(ap)}`);
      if(ap!=null)e.apFinal=ap;
      if(bi===blocks.length-1)e.activo=add.some(m=>m.t==='sueldo');
    }});

/* ============ IMPORTAR CUENTAS CORRIENTES (Cuentas Corrientes.xls, una hoja por mes) ============
   Columnas: Nº CLIENTE · PERSONAL · materiales · CIN (descuento) · Recibo  → "Recibo" es lo que se descuenta del sueldo. */
const MES_IDX={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
function perDeTexto(t){t=normH(t||'');const m=t.match(/(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)[a-z]*\s*(\d{2,4})/);if(!m)return null;let y=+m[2];if(y<100)y+=2000;return y+'-'+pad(MES_IDX[m[1]])}
function ccHoja(wb,sn){
  const A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
  const hr=A.findIndex(r=>r&&r.some(v=>typeof v==='string'&&normH(v)==='recibo')&&r.some(v=>typeof v==='string'&&normH(v).startsWith('personal')));if(hr<0)return null;
  const H=A[hr].map(v=>v==null?'':normH(v));const c={cli:H.findIndex(h=>h.includes('cliente')),nom:H.findIndex(h=>h.startsWith('personal')),mat:H.findIndex(h=>h.startsWith('material')),rec:H.findIndex(h=>h==='recibo')};
  const titulo=(A.slice(0,hr).flat().find(v=>typeof v==='string'&&perDeTexto(v)))||'';
  const rows=[];for(let r=hr+1;r<A.length;r++){const x=A[r];if(!x||typeof x[c.nom]!=='string')continue;rows.push({cli:String(x[c.cli]??'').trim(),nombre:x[c.nom].trim(),mat:+x[c.mat]||0,rec:+x[c.rec]||0})}
  return{titulo,per:perDeTexto(titulo)||perDeTexto(sn),rows};
}
function ccMatch(row){
  const byCli=Object.keys(S.emps).find(i=>(S.emps[i].clientes||[]).includes(row.cli));if(row.cli&&byCli)return byCli;
  if(/^martin\b/i.test(normH(row.nombre)))return '';
  const base=row.nombre.replace(/\(.*?\)/g,'').replace(/\binfo(rmatica)?\b/ig,'');
  const zs=a=>a.map(x=>x.replace(/z/g,'s'));const t=zs(toks(base));if(!t.length)return '';const T=i=>zs(toks(S.emps[i].nombre));
  const c=Object.keys(S.emps).filter(i=>T(i)[0]===t[0]);
  if(c.length===1)return c[0];
  if(c.length){const c2=c.filter(i=>T(i).slice(1).some(x=>t.slice(1).includes(x)));return c2.length===1?c2[0]:''}
  const c3=Object.keys(S.emps).filter(i=>T(i).slice(1).some(x=>t.slice(1).includes(x)));return c3.length===1?c3[0]:'';
}

/* ============ CÁLCULO AD (solo administrador) ============
   AD = %SueldoNeto × Sueldo(recibo del mes) + %Bolsa × Bolsa(ventas netas del mes) + ajuste manual */
const TABLA_DEF=[[400e6,2e6],[500e6,2.5e6],[600e6,3e6],[700e6,3.5e6],[800e6,4e6],[900e6,4.5e6],[1000e6,5e6],[1100e6,5.5e6],[1200e6,6e6],[1300e6,6.5e6],[1400e6,7e6],[1500e6,7.5e6]];
const pct=n=>(Math.round((+n||0)*10000)/100).toLocaleString('es-AR')+'%';
const nameKey=n=>slug(n).split('-').slice(0,2).join('-');
function bolsaDe(v){const t=[...S.ad.tabla].sort((a,b)=>a[0]-b[0]);if(!t.length||!v)return 0;if(v<t[0][0])return t[0][1];let b=t[0][1];for(const[u,x]of t)if(v>=u)b=x;return b}
function cfgDe(i,per){const h=S.ad.cfg[i]||{};const ks=Object.keys(h).filter(k=>k<=per).sort();return ks.length?h[ks.at(-1)]:null}
function sueldoDe(i,per){return Object.values(S.movs[i]||{}).filter(m=>m.per===per&&m.t==='sueldo').reduce((a,m)=>a+(+m.imp||0),0)}
function adActual(i,per){return Object.values(S.movs[i]||{}).filter(m=>m.per===per&&m.t==='adicional').reduce((a,m)=>a+(+m.imp||0),0)}
function calcAD(per){
  const mes=S.ad.mes[per]||{};const ventas=+mes.ventas||0;const bolsa=bolsaDe(ventas);
  const ids=Object.keys(S.emps).filter(i=>S.ad.cfg[i]&&cfgDe(i,per)).sort((a,b)=>S.emps[a].nombre.localeCompare(S.emps[b].nombre));
  const rows=ids.map(i=>{const c=cfgDe(i,per);const su=sueldoDe(i,per);const ps=c.ps*su,pb=c.pb*bolsa;const aj=mes.aj?.[i]||{};
    const calc=Math.round((ps+pb)*100)/100;const fin=Math.round((calc+(+aj.imp||0))*100)/100;return{i,c,su,ps,pb,calc,aj,fin,cur:adActual(i,per)}});
  return{ventas,bolsa,rows,sumPb:rows.reduce((a,r)=>a+(+r.c.pb||0),0)};
}
function viewAD(){
  const p=S.adPer,R=calcAD(p),mes=S.ad.mes[p]||{};
  const tot=k=>R.rows.reduce((a,r)=>a+(+r[k]||0),0);
  const sinSueldo=R.rows.filter(r=>!r.su).length;
  const body=R.rows.map(r=>`<tr data-e="${r.i}"><td><b>${esc(S.emps[r.i].nombre)}</b><div class="mut">${pct(r.c.ps)} sueldo · ${pct(r.c.pb)} bolsa</div></td>
    <td class="n">${r.su?fmt(r.su):'<span class="neg">sin sueldo</span>'}</td><td class="n">${fmt(r.ps)}</td><td class="n">${fmt(r.pb)}</td><td class="n"><b>${fmt(r.calc)}</b></td>
    <td><input type="number" step="0.01" data-aj value="${r.aj.imp||''}" placeholder="+/-" style="min-width:100px;text-align:right" oninput="adFin(this)"></td>
    <td><input data-nota value="${esc(r.aj.nota||'')}" placeholder="motivo" style="min-width:130px"></td>
    <td class="n" data-fin data-calc="${r.calc}"><b>${fmt(r.fin)}</b></td><td class="n ${Math.abs(r.cur-r.fin)>0.5?'neg':'mut'}">${fmt(r.cur)}</td></tr>`).join('');
  return `<div class="card"><div class="row"><div><h2 style="margin:0">Cálculo AD</h2><div class="mut">Solo administrador. AD = % sueldo × sueldo del recibo + % bolsa × bolsa del mes + ajuste.</div></div>
   <div style="flex:0;min-width:170px"><label>Mes</label><input type="month" value="${p}" onchange="S.adPer=this.value;render()"></div></div>
   <div class="grid2" style="margin-top:6px"><div><label>Ventas netas del mes</label><input id="ad_v" type="number" step="0.01" value="${mes.ventas||''}" onchange="adVentas(this.value)"></div>
   <div><label>Bolsa a repartir</label><div class="saldo" style="font-size:22px">${fmt(R.bolsa)}</div></div></div>
   ${Math.abs(R.sumPb-1)>0.0001&&R.rows.length?`<p class="neg">⚠ Los % de bolsa suman ${pct(R.sumPb)} (deberían sumar 100%).</p>`:''}
   ${sinSueldo?`<p class="neg">⚠ ${sinSueldo} empleado/s sin sueldo cargado en la Liquidación de ${perLabel(p)}: cargalo primero allá.</p>`:''}</div>
  <div class="card scroll liq"><table><thead><tr><th>Empleado</th><th class="n">Sueldo</th><th class="n">Parte sueldo</th><th class="n">Parte bolsa</th><th class="n">Calculado</th><th>Ajuste</th><th>Nota (privada)</th><th class="n">AD final</th><th class="n">En liquidación</th></tr></thead>
  <tbody>${body||'<tr><td colspan=9 class="mut">Sin porcentajes cargados. Importá COMISIONES.xlsx o cargalos abajo.</td></tr>'}</tbody>
  <tfoot><tr><th>Totales</th><th class="n">${fmt(tot('su'))}</th><th class="n">${fmt(tot('ps'))}</th><th class="n">${fmt(tot('pb'))}</th><th class="n">${fmt(tot('calc'))}</th><th></th><th></th><th class="n">${fmt(tot('fin'))}</th><th class="n">${fmt(tot('cur'))}</th></tr></tfoot></table>
  <div class="row" style="margin-top:12px"><button class="btn sec" onclick="adGuardar()">Guardar ajustes</button><button class="btn acc" onclick="adPasar()">Pasar AD a la liquidación de ${perLabel(p)}</button></div></div>
  ${viewADConfig()}`;
}
function adFin(el){const tr=el.closest('tr');const td=tr.querySelector('[data-fin]');td.innerHTML='<b>'+fmt(+td.dataset.calc+(+el.value||0))+'</b>'}
async function adVentas(v){const p=S.adPer;(S.ad.mes[p]??={}).ventas=+v||0;await DB.set(`ad/mes/${p}/ventas`,+v||0);render()}
function adLeerAjustes(){const aj={};document.querySelectorAll('.liq tr[data-e]').forEach(tr=>{const v=+tr.querySelector('[data-aj]').value||0,n=tr.querySelector('[data-nota]').value.trim();if(v||n)aj[tr.dataset.e]={imp:v,nota:n}});return aj}
async function adGuardar(silent){const p=S.adPer,aj=adLeerAjustes();(S.ad.mes[p]??={}).aj=aj;await DB.set(`ad/mes/${p}/aj`,Object.keys(aj).length?aj:null);if(!silent){render();alert('Ajustes guardados')}}
async function adPasar(){
  await adGuardar(true);const p=S.adPer,R=calcAD(p);
  if(R.rows.some(r=>!r.su)&&!confirm('Hay empleados sin sueldo cargado ese mes. ¿Pasar igual?'))return;
  if(!confirm(`Se reemplaza el AD de ${perLabel(p)} en la cuenta de ${R.rows.length} empleados (total ${fmt(R.rows.reduce((a,r)=>a+r.fin,0))}). ¿Confirmás?`))return;
  const up={};
  for(const r of R.rows){const movs=S.movs[r.i]??={};
    for(const[id,m]of Object.entries(movs))if(m.per===p&&m.t==='adicional'){up[`movs/${r.i}/${id}`]=null;delete movs[id]}
    if(r.fin){const id=DB.key('movs/'+r.i);const m={t:'adicional',f:lastDay(p),per:p,imp:r.fin,c:'AD '+perLabel(p),src:'ad'};up[`movs/${r.i}/${id}`]=m;movs[id]=m}}
  up[`ad/mes/${p}/pasado`]=today();await DB.update(up);render();alert('AD pasado a la liquidación')}
function viewADConfig(){
  const ids=Object.keys(S.emps).filter(i=>S.emps[i].activo!==false||S.ad.cfg[i]).sort((a,b)=>S.emps[a].nombre.localeCompare(S.emps[b].nombre));
  const rows=ids.map(i=>{const c=cfgDe(i,'9999-12');const hist=Object.entries(S.ad.cfg[i]||{}).sort().map(([k,v])=>`desde ${perLabel(k)}: ${pct(v.ps)} / ${pct(v.pb)}`).join(' · ');
    return `<tr data-c="${i}"><td><b>${esc(S.emps[i].nombre)}</b><div class="mut">${hist||'sin %'}</div></td><td><input type="number" step="0.001" data-ps value="${c?Math.round(c.ps*10000)/100:''}" placeholder="%"></td><td><input type="number" step="0.001" data-pb value="${c?Math.round(c.pb*10000)/100:''}" placeholder="%"></td></tr>`}).join('');
  return `<details class="card"><summary><b>Porcentajes y tabla de bolsa</b></summary>
   <p class="mut">Los % nuevos rigen desde el mes que elijas; los meses anteriores se siguen calculando con el % viejo.</p>
   <div class="scroll liq"><table><thead><tr><th>Empleado</th><th>% Sueldo neto</th><th>% Bolsa</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="row" style="margin-top:10px"><div style="flex:0;min-width:170px"><label>Rigen desde</label><input id="cf_d" type="month" value="${S.adPer}"></div><div style="flex:0"><label>&nbsp;</label><button class="btn" onclick="adGuardarCfg()">Guardar porcentajes</button></div></div>
   <label style="margin-top:16px">Tabla de bolsa (una línea por escalón: ventas desde ; bolsa)</label>
   <textarea id="cf_t" rows="7">${S.ad.tabla.map(([a,b])=>a+' ; '+b).join('\n')}</textarea>
   <p class="mut">Si las ventas están por debajo del primer escalón, se usa la bolsa del primer escalón.</p><button class="btn sec" onclick="adGuardarTabla()">Guardar tabla</button>
   <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><b>Importar desde COMISIONES.xlsx</b><p class="mut">Toma de la hoja "Calculo": % de cada empleado, tabla de bolsa y ventas netas de cada mes. No toca los AD ya cargados.</p>
   <input type="file" accept=".xlsx,.xls" onchange="adImport(this.files[0])"><div id="adimp" class="mut" style="margin-top:6px"></div></details>`;
}
async function adGuardarCfg(){const d=$('#cf_d').value;if(!d)return alert('Elegí desde qué mes');const up={};let n=0;
  document.querySelectorAll('tr[data-c]').forEach(tr=>{const i=tr.dataset.c,ps=tr.querySelector('[data-ps]').value,pb=tr.querySelector('[data-pb]').value;if(ps===''&&pb==='')return;
    const v={ps:(+ps||0)/100,pb:(+pb||0)/100};const prev=cfgDe(i,d);if(prev&&Math.abs(prev.ps-v.ps)<1e-9&&Math.abs(prev.pb-v.pb)<1e-9)return;
    (S.ad.cfg[i]??={})[d]=v;up[`ad/cfg/${i}/${d}`]=v;n++});
  if(!n)return alert('No hay cambios');await DB.update(up);render();alert(n+' empleado/s actualizados desde '+perLabel(d))}
async function adGuardarTabla(){const t=$('#cf_t').value.split('\n').map(l=>l.split(/[;\t]/).map(x=>+String(x).replace(/[^\d.-]/g,''))).filter(r=>r.length>=2&&r[0]>0&&r[1]>0).map(r=>[r[0],r[1]]).sort((a,b)=>a[0]-b[0]);
  if(!t.length)return alert('Tabla vacía');S.ad.tabla=t;await DB.set('ad/tabla',t);render();alert('Tabla guardada')}
async function adImport(file){if(!file)return;const msg=$('#adimp');
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const ws=wb.Sheets['Calculo'];if(!ws)throw new Error('No encuentro la hoja "Calculo"');
    const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const months=[];(A[0]||[]).forEach((v,c)=>{const d=hdrDate(v);if(d)months.push({c,per:d.slice(0,7)})});if(!months.length)throw new Error('No encuentro los meses en la fila 1');
    const desde=months[0].per;const byKey={};for(const i in S.emps)byKey[nameKey(S.emps[i].nombre)]=i;
    const up={},sinMatch=[];let ne=0,nv=0;const tabla=[];
    for(let r=2;r<A.length;r++){const row=A[r]||[];const n=row[0];
      if(typeof n==='string'&&typeof row[1]==='number'&&typeof row[2]==='number'){const i=byKey[nameKey(n)];if(!i){sinMatch.push(n);continue}
        if(!S.ad.cfg[i]||!Object.keys(S.ad.cfg[i]).length){const v={ps:row[1],pb:row[2]};(S.ad.cfg[i]??={})[desde]=v;up[`ad/cfg/${i}/${desde}`]=v;ne++}}
      if(typeof n==='string'&&normH(n)==='ventas netas'){for(let k=r+1;k<A.length;k++){const a=A[k]?.[0],b=A[k]?.[1];if(typeof a==='number'&&typeof b==='number')tabla.push([a,b]);else if(tabla.length)break}
        for(const m of months){const v=row[m.c+1];if(typeof v==='number'&&v>0){(S.ad.mes[m.per]??={}).ventas=v;up[`ad/mes/${m.per}/ventas`]=v;nv++}}}}
    if(tabla.length){S.ad.tabla=tabla;up['ad/tabla']=tabla}
    await DB.update(up);render();
    alert(`Importado: % de ${ne} empleados (desde ${perLabel(desde)}), ventas de ${nv} meses, tabla de ${tabla.length} escalones.`+(sinMatch.length?`\nSin coincidencia: ${sinMatch.join(', ')}`:''));
  }catch(e){msg.textContent='Error: '+e.message;console.error(e)}}

render();
</script>
</body>
</html>
